<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essence Network — Live</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>:root{--b:#0B4F8A;--g:#2DB64B;--k:#080B12;--w:#fff;--m:#98A2B3;--p:#101722;--l:#222936}*{box-sizing:border-box}body{margin:0;background:var(--k);color:var(--w);font:15px system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{width:230px;height:65px;object-fit:contain;object-position:left center}.btn{background:#142235;border:1px solid #27364a;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;cursor:pointer}.hero{padding:35px 0}.hero h1{font-size:44px;margin:0 0 8px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px}.thumb{aspect-ratio:16/9;background:#05070b;border-radius:10px;display:grid;place-items:center;overflow:hidden}.thumb video{width:100%;height:100%;object-fit:contain}.live{color:#6be38c;font-weight:800}.off{color:#98A2B3}.foot{padding:40px 0;color:#667085}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="nav"><img class="logo" src="/essence-logo.png"><a class="btn" href="/studio.html">Studio Login</a></div><div class="hero"><div class="muted">LIVE TELEVISION • ONLINE BROADCAST</div><h1>WHERE ESSENCE MEETS EXPRESSION</h1><p class="muted">Watch Essence Network channels live online.</p></div><div id="grid" class="grid"></div><div class="foot">Essence Network • Founder & CEO: IBAUT JUSTINE</div></div><script>async function load(){let d=await fetch('/api/public').then(r=>r.json());document.getElementById('grid').innerHTML=d.channels.map(c=>`<div class="card"><div class="thumb"><video id="v-${c.id}" muted autoplay playsinline controls></video></div><h2>${c.name}</h2><div class="${c.status==='ON AIR'?'live':'off'}">● ${c.status}</div><p class="muted">${c.description}</p></div>`).join('');d.channels.forEach(c=>play('v-'+c.id,c.stream_url))}function play(id,url){let v=document.getElementById(id);if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=url;else if(window.Hls&&Hls.isSupported()){let h=new Hls();h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}))}}load();setInterval(load,10000)</script></body></html>
