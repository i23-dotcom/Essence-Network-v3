<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essence Studio Login</title><style>body{margin:0;background:#080B12;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);background:#101722;border:1px solid #222936;border-radius:16px;padding:25px}.logo{width:220px}.in{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;background:#080B12;color:#fff;border:1px solid #2b3442;border-radius:8px}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#0B4F8A;color:#fff;font-weight:800;cursor:pointer}.err{color:#ff8f8f}</style></head><body><div class="box"><img class="logo" src="/essence-logo.png"><h2>Broadcast Studio</h2><p>Authorized operations only.</p><input id="e" class="in" type="email" placeholder="Email"><input id="p" class="in" type="password" placeholder="Password"><button class="btn" onclick="go()">SIGN IN</button><p id="m" class="err"></p></div><script>async function go(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.value,password:p.value})});let j=await r.json();if(j.ok)location='/studio.html';else m.textContent=j.message||'Login failed'}</script></body></html>
